<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Typing Duel</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
    <link rel="stylesheet" href="/typing-duel/style.css?v=3">
</head>
<body>
    <input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1">

    <section id="lobby">
        <h1>Typing Duel</h1>
        <p class="sub">Ketik cepat, serang duluan, menangkan lomba!</p>

        <input id="name" maxlength="16" placeholder="Nama kamu">

        <!-- Pilih mode: bagian lobby lain menyesuaikan lewat data-modes -->
        <div id="modes">
            <button class="mode sel" data-mode="duel">Duel Cepat</button>
            <button class="mode" data-mode="marathon">Adu Banyak</button>
            <button class="mode" data-mode="wpm">Tes WPM</button>
        </div>
        <p id="modeInfo"></p>

        <div id="chars" data-modes="duel marathon"></div>
        <div id="desc" data-modes="duel marathon"></div>

        <!-- Satu tombol utama per mode -->
        <div class="actions">
            <button id="quick" data-modes="duel marathon">Cari lawan</button>
            <button id="wpm" data-modes="wpm">Mulai tes (1 menit)</button>
        </div>

        <!-- Pilihan tambahan, ukurannya kecil -->
        <div class="more" data-modes="duel marathon">
            <div class="join">
                <input id="room" maxlength="12" placeholder="Kode room (mis. ARENA1)">
                <button id="go" class="mini">Masuk</button>
            </div>
            <div class="bots" data-modes="duel">
                <span>Lawan bot:</span>
                <button class="train mini" data-level="normal">Normal</button>
                <button class="train mini" data-level="hard">Hard</button>
            </div>
        </div>

        <p id="msg"></p>
    </section>

    <section id="game" hidden>
        <div class="hud" id="h0"><b></b><div class="bar"><i></i></div><span></span></div>
        <div class="hud r" id="h1"><b></b><div class="bar"><i></i></div><span></span></div>
        <div id="rnd"></div>
        <div id="word"></div>
        <div id="info"></div>
        <div id="timer"><i></i></div>
        <div class="char" id="c0"><img></div>
        <div class="char r" id="c1"><img></div>
        <div class="floor"></div>
        <div id="dock">
            <div class="fx" id="fx0"></div>
            <div class="fx r" id="fx1"></div>
        </div>
        <div id="flash"></div>
        <div id="over" hidden>
            <p id="verdict"></p>
            <h2></h2>
            <button onclick="location.reload()">Main lagi</button>
        </div>
    </section>

    <section id="run" hidden>
        <div id="lanes" hidden>
            <div class="lane" id="ln0"><img><b></b><div class="lbar"><i></i></div><span>0</span></div>
            <div class="lane r" id="ln1"><img><b></b><div class="lbar"><i></i></div><span>0</span></div>
        </div>
        <div id="rtime">60</div>
        <div id="rbar"><i></i></div>
        <div id="rword"></div>
        <div id="rnext"></div>
        <div id="rstat"></div>
        <div id="rcount"></div>
        <div id="rover" hidden>
            <p id="rverdict"></p>
            <h2></h2>
            <p id="rsub"></p>
            <div id="rres"></div>
            <button onclick="location.reload()">Main lagi</button>
        </div>
    </section>

    <script src="/typing-duel/game.js?v=3"></script>
</body>
</html>
