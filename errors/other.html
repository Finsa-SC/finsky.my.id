<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e1e2e">
<title>Something went wrong</title>
<style>
:root{
  /* Catppuccin Mocha */
  --rosewater:#f5e0dc;--pink:#f5c2e7;--mauve:#cba6f7;--red:#f38ba8;--peach:#fab387;--yellow:#f9e2af;
  --green:#a6e3a1;--teal:#94e2d5;--blue:#89b4fa;--lavender:#b4befe;
  --text:#cdd6f4;--subtext1:#bac2de;--overlay0:#6c7086;--surface1:#45475a;--surface0:#313244;
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --accent:var(--blue);
  /* ===== ASSET LAYOUT (desktop) : edit width / offset / bottom per asset ===== */
  --oguri-w:clamp(140px,19vw,280px);--oguri-x:3vw;--oguri-bottom:2vh;--oguri-display:block;
  --acute-w:clamp(140px,19vw,280px);--acute-x:3vw;--acute-bottom:2vh;--acute-display:block;
  --acutehello-w:clamp(110px,15vw,220px);--acutehello-x:calc(3vw + clamp(140px,19vw,280px));--acutehello-bottom:2vh;--acutehello-display:block;
  --acutedance-w:clamp(110px,15vw,220px);--acutedance-x:calc(3vw + clamp(140px,19vw,280px));--acutedance-bottom:2vh;--acutedance-display:block;
  --reserve-bottom:0px; /* extra space under the text card so assets never cover it */
}
@media (max-width:640px){
  :root{
/* ===== ASSET LAYOUT (mobile) ===== */
    --oguri-w:105px;--oguri-x:2vw;--oguri-bottom:1vh;--oguri-display:block;
    --acute-w:105px;--acute-x:2vw;--acute-bottom:1vh;--acute-display:block;
    --acutehello-w:80px;--acutehello-x:calc(2vw + 105px);--acutehello-bottom:1vh;--acutehello-display:block;
    --acutedance-w:80px;--acutedance-x:calc(2vw + 105px);--acutedance-bottom:1vh;--acutedance-display:block;
    --reserve-bottom:140px;
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  min-height:100dvh;color:var(--text);font-family:"Nunito","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 45%),
    radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--mauve) 14%,transparent),transparent 45%),
    var(--base);
  display:grid;place-items:center;overflow-x:hidden;
}
.track{position:fixed;left:0;right:0;bottom:12%;height:6px;background:repeating-linear-gradient(90deg,var(--surface1) 0 24px,transparent 24px 40px);opacity:.5;border-radius:3px}
main{position:relative;z-index:1;width:min(92vw,560px);padding:24px 0 calc(24px + var(--reserve-bottom));text-align:center}
.card{background:color-mix(in srgb,var(--mantle) 82%,transparent);backdrop-filter:blur(6px);border:2px solid var(--surface1);border-radius:24px;padding:28px 24px;box-shadow:0 10px 0 var(--crust)}
.code{font-size:clamp(4.5rem,18vw,8rem);font-weight:900;line-height:1;color:var(--accent);letter-spacing:.04em;text-shadow:4px 4px 0 var(--crust)}
h1{margin-top:6px;font-size:clamp(1.3rem,4.5vw,1.8rem);color:var(--rosewater)}
p{margin-top:10px;color:var(--subtext1);line-height:1.6}
.path{display:inline-block;margin-top:14px;max-width:100%;padding:4px 12px;border-radius:999px;background:var(--surface0);color:var(--lavender);font:.85rem ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{padding:10px 20px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--crust);font:inherit;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .12s}
.btn.alt{background:transparent;color:var(--accent)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--lavender);outline-offset:3px}
/* assets */
.asset{position:fixed;z-index:2;pointer-events:none;user-select:none;bottom:var(--bottom);width:var(--w);height:auto;max-width:45vw}
.asset.left{left:var(--x)}.asset.right{right:var(--x)}
.group{position:fixed;z-index:2;pointer-events:none;bottom:var(--bottom);width:var(--w);max-width:45vw;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.group.right{right:var(--x)}.group.left{left:var(--x);align-items:flex-start}
.group img{width:100%;height:auto;user-select:none}
.bubble{position:relative;width:max-content;max-width:min(260px,70vw);padding:12px 16px;border-radius:18px;background:var(--rosewater);color:var(--crust);font-weight:800;font-size:.95rem;line-height:1.4;text-align:center}
.bubble::after{content:"";position:absolute;bottom:-9px;right:28%;border:10px solid transparent;border-top-color:var(--rosewater);border-bottom:0}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="track" aria-hidden="true"></div>
<img id="oguri" class="asset left" style="--w:var(--oguri-w);--x:var(--oguri-x);--bottom:var(--oguri-bottom);display:var(--oguri-display)" data-asset="oguri-confused.png" alt="Oguri Cap looking confused">
<img id="acute" class="asset right" style="--w:var(--acute-w);--x:var(--acute-x);--bottom:var(--acute-bottom);display:var(--acute-display)" data-asset="acute-ready.png" alt="Acute ready to go">
<img id="acutehello" class="asset left" style="--w:var(--acutehello-w);--x:var(--acutehello-x);--bottom:var(--acutehello-bottom);display:var(--acutehello-display)" data-asset="acute-hello.gif" alt="Acute waving">
<img id="acutedance" class="asset right" style="--w:var(--acutedance-w);--x:var(--acutedance-x);--bottom:var(--acutedance-bottom);display:var(--acutedance-display)" data-asset="acute-dance.gif" alt="Acute dancing">
<main>
  <div class="card">
    <div class="code" id="code">???</div>
    <h1>Unexpected error</h1>
    <p>The request could not be completed. Please try again or head back to the start.</p>
    <span class="path" id="path"></span>
    <div class="actions">
      <a class="btn" href="/">Back to the paddock</a>
      <button class="btn alt" type="button" id="back">Go back</button>
    </div>
  </div>
</main>
<script>
/* Change this if your nginx serves the assets from another URL path */
const ASSET_BASE = "/errors/assets/";

document.querySelectorAll("img[data-asset]").forEach(img => {
  img.addEventListener("error", () => img.style.display = "none");
  img.src = ASSET_BASE + img.dataset.asset;
});
document.getElementById("path").textContent = location.pathname + location.search;
document.getElementById("back").addEventListener("click", () => history.length > 1 ? history.back() : location.assign("/"));
/* Optional: link here with ?code=502 to show the status code */
const c = new URLSearchParams(location.search).get("code");
if (c && /^\d{3}$/.test(c)) document.getElementById("code").textContent = c;
</script>
</body>
</html>
