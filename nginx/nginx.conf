events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;

    # Network & I/O Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;

    error_page 404 /global_error/404.html;
    error_page 402 403 /global_error/forbidden.html;
    error_page 500 502 503 504 /global_error/internal.html;
    error_page 400 401 405 408 429 501 505 /global_error/other.html;

    include /etc/nginx/sites-enabled/*;
}