apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: typing-duel-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: typing-duel-deploy
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70