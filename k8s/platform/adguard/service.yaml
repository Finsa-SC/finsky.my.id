apiVersion: v1
kind: Service
metadata:
  name: adguard-service
  labels:
    app: adguard
spec:
  ports:
  - name: adguard-port
    protocol: TCP
    port: 8201
    targetPort: 80
  - name: dns-tcp
    protocol: TCP
    port: 53
    targetPort: 53
  - name: dns-udp
    protocol: UDP
    port: 53
    targetPort: 53
  selector:
    app: adguard
  type: ClusterIP
status:
  loadBalancer: {}
