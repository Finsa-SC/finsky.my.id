apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  - name: nginx-main
    files:
      - config/nginx.conf

  - name: nginx-conf-d
    files:
      - config/conf.d/global_error.conf

  - name: nginx-sites
    files:
      - config/sites/deck.finsky.my.id
      - config/sites/dns.finsky.my.id
      - config/sites/downloader.finsky.my.id
      - config/sites/drive.finsky.my.id
      - config/sites/finsky.my.id
      - config/sites/game.finsky.my.id

  - name: nginx-snippets
    files:
      - config/snippets/static_cache.conf