apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser-deploy
  labels:
    app: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  strategy: {}
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      initContainers:
        - name: configure-filebrowser
          image: filebrowser/filebrowser:latest
          command:
            - /bin/sh
            - -ec
          args:
            - |
              DB="/database/filebrowser.db"

              if [ ! -s "$DB" ]; then
                filebrowser config init \
                  --database "$DB" \
                  --address 0.0.0.0 \
                  --port 80 \
                  --root /srv
              else
                filebrowser config set \
                  --database "$DB" \
                  --address 0.0.0.0 \
                  --port 80 \
                  --root /srv
              fi

              if filebrowser users ls --database "$DB" | grep -Fq -- "$USERNAME"; then
                filebrowser users update "$USERNAME" \
                  --password "$PASSWORD" \
                  --perm.admin \
                  --database "$DB"
              else
                filebrowser users add "$USERNAME" "$PASSWORD" \
                  --perm.admin \
                  --database "$DB"
              fi

          env:
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: filebrowser-secret
                  key: USERNAME
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filebrowser-secret
                  key: PASSWORD

          volumeMounts:
            - name: filebrowser-database
              mountPath: /database
            - name: filebrowser-drive
              mountPath: /srv

      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          volumeMounts:
            - name: filebrowser-database
              mountPath: /database
            - name: filebrowser-drive
              mountPath: /srv
      volumes:
        - name: filebrowser-database
          persistentVolumeClaim:
            claimName: filebrowser-db-pvc

        - name: filebrowser-drive
          persistentVolumeClaim:
            claimName: filebrowser-drive-pvc

status: {}
