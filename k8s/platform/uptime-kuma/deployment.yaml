apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma-deploy
  labels:
    app: uptime-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  strategy: {}
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2
          volumeMounts:
            - name: kuma-storage
              mountPath: /app/data
      volumes:
        - name: kuma-storage
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
status: {}
