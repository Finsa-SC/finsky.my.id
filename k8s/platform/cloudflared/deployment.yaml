apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-deploy
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  strategy: {}
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - "$(TUNNEL_TOKEN)"
          resources: {}
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-secret
                  key: TUNNEL_TOKEN
status: {}
