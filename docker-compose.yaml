version: '3.8'

services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - "./portofolio:/usr/share/nginx/html:ro"
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/sites-available:/etc/nginx/sites-available:ro"
      - "./nginx/sites-enabled:/etc/nginx/sites-enabled:ro"
    depends_on:
      - cloudflared
      - filebrowser

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: always
    ports:
      - "127.0.0.1:8200:80"
    volumes:
      - filebrowser_storage:/srv
      - filebrowser_db:/database
    environment:
      - PUID=1000
      - PGID=1000


volumes:
  filebrowser_storage:
  filebrowser_db: