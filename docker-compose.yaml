x-project:
  version: "1.0.0"

services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - "./portofolio:/usr/share/nginx/html:ro"
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/sites-available:/etc/nginx/sites-available:ro"
      - "./nginx/sites-enabled:/etc/nginx/sites-enabled:ro"
    depends_on:
      - cloudflared
      - filebrowser

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: always
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        filebrowser config init --database /database/filebrowser.db || true
        filebrowser config set --database /database/filebrowser.db --address 0.0.0.0 --port 80 --root /srv || true
        filebrowser users add "${FB_USERNAME}" "${FB_PASSWORD}" --perm.admin --database /database/filebrowser.db || true
        filebrowser users update "${FB_USERNAME}" --password "${FB_PASSWORD}" --database /database/filebrowser.db || true
        exec filebrowser --database /database/filebrowser.db
    ports:
      - "127.0.0.1:8200:80"
    volumes:
      - /srv/drive/:/srv
      - filebrowser_db:/database
    environment:
      - PUID=1000
      - PGID=1000

  # DNS
  adguard:
    image: adguard/adguardhome:latest
    user: 1000:1000
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8201:80"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - "8202:3001"
    volumes:
      - ./uptime-kuma:/app/data

volumes:
  filebrowser_storage:
  filebrowser_db: